# Copies main to Ankit-core27/Evidentia after every push, so that repository stays a
# current copy of this one. Treat it as read-only: changes made there are not copied
# back, and a push there that this repo doesn't have makes the next mirror fail
# rather than overwrite it.
#
# Needs the MIRROR_TOKEN secret (Settings > Secrets and variables > Actions): a
# fine-grained token owned by Ankit-core27 with access to Ankit-core27/Evidentia only,
# and "Contents: Read and write". Without the secret the job is skipped.
name: Mirror main to Ankit-core27/Evidentia

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-main
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check for the token
        id: token
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          if [ -n "$MIRROR_TOKEN" ]; then
            echo "set=true" >> "$GITHUB_OUTPUT"
          else
            echo "set=false" >> "$GITHUB_OUTPUT"
            echo "MIRROR_TOKEN isn't set, so main wasn't mirrored." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.set == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push main
        if: steps.token.outputs.set == 'true'
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: git push "https://x-access-token:${MIRROR_TOKEN}@github.com/Ankit-core27/Evidentia.git" HEAD:refs/heads/main
