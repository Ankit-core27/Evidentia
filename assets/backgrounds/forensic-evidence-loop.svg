<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
 <!-- Calm backdrop for a data-dense UI: depth, a horizon grid and one slow scan sweep. No detail sits behind content. -->
 <defs>
  <radialGradient id="bg" cx=".5" cy=".35" r=".75"><stop stop-color="#13181a"/><stop offset=".6" stop-color="#0f1113"/><stop offset="1" stop-color="#0b0d0e"/></radialGradient>
  <linearGradient id="beam" x2="0" y2="1"><stop stop-color="#37aebd" stop-opacity="0"/><stop offset=".5" stop-color="#37aebd" stop-opacity=".07"/><stop offset="1" stop-color="#37aebd" stop-opacity="0"/></linearGradient>
  <linearGradient id="gridFade" x2="0" y2="1"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".35" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff"/></linearGradient>
  <mask id="gm"><rect y="390" width="1920" height="690" fill="url(#gridFade)"/></mask>
 </defs>
 <rect width="1920" height="1080" fill="url(#bg)"/>
 <g mask="url(#gm)" fill="none" stroke="#37aebd" stroke-opacity=".09">
  <path d="M960 390L-500 1080M960 390L-220 1080M960 390L0 1080M960 390L330 1080M960 390L650 1080M960 390L1270 1080M960 390L1590 1080M960 390L1920 1080M960 390L2140 1080M960 390L2420 1080"/>
  <path d="M0 505H1920M0 595H1920M0 700H1920M0 820H1920M0 960H1920"/>
 </g>
 <rect y="-160" width="1920" height="160" fill="url(#beam)">
  <animate attributeName="y" values="-160;1080" dur="14s" repeatCount="indefinite"/>
 </rect>
</svg>
